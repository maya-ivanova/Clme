name: .NET CI

on: 
  push:
    branches: ["main", "mihome", "miwork"]
  pull_request:
    branches: ["main", "mihome", "miwork"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore
        run: dotnet restore Coolme.slnx

      - name: Build
        run: dotnet build Coolme.slnx --configuration Release --no-restore

      - name: Run Tests (SQLite)
        env:
          ASPNETCORE_ENVIRONMENT: Staging
        run: dotnet test Coolme.slnx --configuration Release --no-build --verbosity normal
